<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GameForge AI：AI时代的游戏项目筛选、共创与发行支持平台原型"
    />
    <title>GameForge AI · 平台原型</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23121619%22/><path d=%22M14 14h16v16H14zm20 0h16v16H34zM14 34h16v16H14zm20 0h16v16H34z%22 fill=%22%23d8ff58%22/></svg>" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>

    <header class="topbar">
      <button class="brand" data-action="navigate" data-view="home" aria-label="返回首页">
        <span class="brand-mark" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </span>
        <span class="brand-copy">
          <strong>GAMEFORGE</strong>
          <small>AI</small>
        </span>
      </button>

      <nav class="main-nav" aria-label="主导航">
        <button class="nav-item active" data-action="navigate" data-view="home">
          <span>首页</span><small>游戏中心</small>
        </button>
        <button class="nav-item" data-action="navigate" data-view="cocreate">
          <span>共创中心</span><small>项目任务</small>
        </button>
        <button class="nav-item" data-action="navigate" data-view="mine">
          <span>我的</span><small>工作台</small>
        </button>
      </nav>

      <div class="top-actions">
        <button class="release-countdown" data-action="open-release-batch">
          <span class="status-dot"></span>
          <span>秋季批次</span>
          <strong>12 天</strong>
        </button>
        <button class="icon-button" data-action="toggle-notifications" aria-label="通知">
          <span class="bell-icon">◌</span><i class="notification-dot"></i>
        </button>
        <button class="profile-button" data-action="cycle-role">
          <span class="avatar">林</span>
          <span class="profile-copy"><strong>林澈</strong><small id="active-role">创作者</small></span>
          <span class="chevron">⌄</span>
        </button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <button class="ai-fab" data-action="toggle-ai" aria-label="打开 Forge AI 助手">
      <span class="ai-orb"><i></i></span>
      <span><strong>Forge</strong><small>AI 助手</small></span>
      <kbd>⌘ K</kbd>
    </button>

    <aside class="ai-drawer" id="ai-drawer" aria-hidden="true">
      <div class="drawer-head">
        <div class="drawer-title">
          <span class="ai-orb small"><i></i></span>
          <span><strong>Forge</strong><small>理解你的项目与授权数据</small></span>
        </div>
        <button class="close-button" data-action="toggle-ai" aria-label="关闭">×</button>
      </div>
      <div class="ai-context" id="ai-context">
        <span>当前上下文</span><strong>游戏中心</strong><small>仅使用公开游戏数据</small>
      </div>
      <div class="chat-stream" id="chat-stream">
        <div class="chat-message assistant">
          <span class="chat-avatar">F</span>
          <div>
            <p>你好，林澈。我可以帮你找游戏、分析项目、匹配人才，或解释 Agent 报告。</p>
            <div class="prompt-suggestions">
              <button data-action="use-prompt">找不肝不氪的探索游戏</button>
              <button data-action="use-prompt">分析《星环余烬》的发布风险</button>
              <button data-action="use-prompt">匹配 Unity 战斗系统人才</button>
            </div>
          </div>
        </div>
      </div>
      <form class="chat-composer" id="chat-form">
        <button type="button" class="attach-button" aria-label="添加资料">＋</button>
        <textarea id="chat-input" rows="1" placeholder="用自然语言告诉 Forge 你想做什么…"></textarea>
        <button type="submit" class="send-button" aria-label="发送">↑</button>
      </form>
      <p class="ai-disclaimer">AI 生成内容会被标记。合同、资金与发布等关键动作仍需你明确确认。</p>
    </aside>

    <div class="drawer-backdrop" id="drawer-backdrop" data-action="toggle-ai"></div>
    <div class="modal-root" id="modal-root" aria-live="polite"></div>
    <div class="toast-root" id="toast-root" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
